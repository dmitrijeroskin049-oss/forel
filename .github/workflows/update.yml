name: Forel agent
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install requests beautifulsoup4 lxml
      - name: Run agent
        run: python agent.py
      - name: Save progress
        run: |
          git config user.name "forel-bot"
          git config user.email "forel-bot@users.noreply.github.com"
          git add state.json pages index.html || true
          git commit -m "agent update" || echo "nothing to commit"
          git push
